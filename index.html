 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(payload.salt),iterations:payload.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
 const html=await decrypt(key);
 if(remember)storage.save({key:enc(await crypto.subtle.exportKey('raw',key)),salt:payload.salt,until:Date.now()+30*86400000});else storage.clear();
 show(html);
}
document.getElementById('gate-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('unlock');button.disabled=true;
 try{await openWithPassword(document.getElementById('password').value,document.getElementById('remember').checked);}
 catch{document.getElementById('error').textContent=crypto.subtle?'Пароль не подошёл. Проверьте его на слайде.':'Откройте тренажёр по защищённой ссылке HTTPS.';document.getElementById('password').value='';button.disabled=false;}
});
(async()=>{const saved=storage.read();if(!saved)return;if(saved.until<Date.now()||saved.salt!==payload.salt){storage.clear();return;}try{const key=await crypto.subtle.importKey('raw',dec(saved.key),'AES-GCM',false,['decrypt']);show(await decrypt(key));}catch{storage.clear();}})();
