const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(payload.iv)},key,dec(payload.ct)));}
function show(html){
 const parsed=new DOMParser().parseFromString(html,'text/html');
 document.documentElement.innerHTML=parsed.documentElement.innerHTML;
 for(const old of [...document.querySelectorAll('script')]){const fresh=document.createElement('script');for(const a of old.attributes)fresh.setAttribute(a.name,a.value);fresh.textContent=old.textContent;old.replaceWith(fresh)}
 window.scrollTo(0,0);
}
