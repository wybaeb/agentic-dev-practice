const cacheName='agentic-practice-key:'+location.pathname;
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const storage={read(){try{return JSON.parse(localStorage.getItem(cacheName));}catch{return null;}},clear(){try{localStorage.removeItem(cacheName);}catch{}},save(v){try{localStorage.setItem(cacheName,JSON.stringify(v));}catch{}}};
async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(payload.iv)},key,dec(payload.ct)));}
function show(html){
 const parsed=new DOMParser().parseFromString(html,'text/html');
 document.documentElement.innerHTML=parsed.documentElement.innerHTML;
 for(const old of [...document.querySelectorAll('script')]){const fresh=document.createElement('script');for(const a of old.attributes)fresh.setAttribute(a.name,a.value);fresh.textContent=old.textContent;old.replaceWith(fresh)}
 window.scrollTo(0,0);
}
async function openWithPassword(password,remember){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(payload.salt),iterations:payload.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
 const html=await decrypt(key);
 if(remember)storage.save({key:enc(await crypto.subtle.exportKey('raw',key)),salt:payload.salt,until:Date.now()+30*86400000});else storage.clear();
 show(html);
}
document.getElementById('gate-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('unlock');button.disabled=true;
 try{await openWithPassword(document.getElementById('password').value,document.getElementById('remember').checked);}
 catch{document.getElementById('error').textContent=crypto.subtle?'Пароль не подошёл. Проверьте его на слайде.':'Откройте тренажёр по защищённой ссылке HTTPS.';document.getElementById('password').value='';button.disabled=false;}
});
(async()=>{const saved=storage.read();if(!saved)return;if(saved.until<Date.now()||saved.salt!==payload.salt){storage.clear();return;}try{const key=await crypto.subtle.importKey('raw',dec(saved.key),'AES-GCM',false,['decrypt']);show(await decrypt(key));}catch{storage.clear();}})();
